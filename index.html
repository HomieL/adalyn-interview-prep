<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adalyn Interview Prep</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-hd">
      <div class="lmark"><svg viewBox="240 180 660 660" width="22" height="22" aria-hidden="true"><path d="M300 724 L512 292 L724 724" fill="none" stroke="#fff" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/><line x1="470" y1="600" x2="554" y2="600" stroke="#ffe4d6" stroke-width="72" stroke-linecap="round"/><path d="M770 200 Q778 262 840 270 Q778 278 770 340 Q762 278 700 270 Q762 262 770 200 Z" fill="#ffe4d6"/></svg></div>
      <div><div class="ltitle">Adalyn</div><div class="lsub">SDE Intern Prep</div></div>
      <button class="btn-settings-icon" id="addChBtn" title="添加章节 / Add chapter">＋</button>
      <button class="btn-settings-icon" id="settingsBtn" title="API Key 设置">⚙️</button>
    </div>
    <div class="sb-body" id="sbBody"></div>
    <div id="sb-footer" class="sb-footer"></div>
  </aside>
  <div class="main">
    <div class="topbar" id="topbar" style="display:none">
      <span class="topbar-title" id="topbarTitle"></span>
      <button class="tab-btn active" data-tab="knowledge" id="tabKnowledge">知识框架</button>
      <button class="tab-btn" data-tab="quiz" id="tabQuiz">Quiz 练习</button>
      <button class="tab-btn" data-tab="flashcard" id="tabFlashcard">🃏 闪卡</button>
    </div>
    <div class="content" id="mainContent"></div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
